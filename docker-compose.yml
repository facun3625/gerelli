services:
  db:
    image: postgres:16-alpine
    container_name: gerelli-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gerelli
      POSTGRES_PASSWORD: gerelli
      POSTGRES_DB: gerelli
    ports:
      - "5462:5432"
    volumes:
      - gerelli_db_data:/var/lib/postgresql/data

volumes:
  gerelli_db_data:
